<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Afghanistan | Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --ink: #12262c;
        --cream: #f4ede0;
        --turquoise-deep: #0f4b58;
        --gold: #c99a3c;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      html,
      body {
        background: var(--cream);
      }
      body {
        font-family: "Vazirmatn", sans-serif;
        color: var(--ink);
      }

      header {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 28px;
        background: rgba(244, 237, 224, 0.95);
        backdrop-filter: blur(6px);
        border-bottom: 1px solid rgba(18, 38, 44, 0.08);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: 1.05rem;
        color: var(--turquoise-deep);
        text-decoration: none;
      }
      nav {
        display: flex;
        gap: 24px;
        font-size: 0.9rem;
        font-weight: 500;
      }
      nav a {
        opacity: 0.8;
        color: inherit;
        text-decoration: none;
        transition: opacity 0.2s;
      }
      nav a:hover {
        opacity: 1;
      }
      nav a.active {
        opacity: 1;
        color: var(--turquoise-deep);
        font-weight: 700;
      }
      @media (max-width: 680px) {
        nav {
          display: none;
        }
      }

      .page-head {
        padding: 48px 28px 8px;
        max-width: 1100px;
        margin: 0 auto;
        text-align: left !important;
        direction: ltr !important;
        color: var(--turquoise-deep);
      }

      .page-head p {
        text-align: left !important;
        direction: ltr !important;
        color: #5b6b6d;
      }

      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
        padding: 32px 28px 70px;
        max-width: 1100px;
        margin: 0 auto;
      }
      @media (max-width: 760px) {
        .gallery-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 460px) {
        .gallery-grid {
          grid-template-columns: 1fr;
        }
      }

      .gwrap {
        position: relative;
        border-radius: 16px;
        overflow: hidden;
        aspect-ratio: 4/3;
        background: #274e57;
        cursor: pointer;
      }
      .gwrap img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .gwrap span {
        position: absolute;
        left: 12px;
        bottom: 10px;
        z-index: 2;
        color: #fff;
        font-size: 0.85rem;
        font-weight: 600;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
      }

      .lightbox {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(4, 10, 13, 0.9);
        padding: 24px;
      }
      .lightbox.show {
        display: flex;
      }
      .lightbox-inner {
        max-width: 800px;
        width: 100%;
      }
      .lightbox-inner img {
        width: 100%;
        border-radius: 12px;
        max-height: 70vh;
        object-fit: cover;
        background: #274e57;
      }
      .lightbox-caption {
        color: #fff;
        text-align: center;
        margin-top: 12px;
        font-size: 0.9rem;
      }
      .lightbox-close {
        position: absolute;
        top: 20px;
        right: 20px;
        color: #fff;
        font-size: 1.6rem;
        cursor: pointer;
      }
    </style>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/mobile-menu.css" />
    <style>
      .booking-style-header {
        display: block;
        width: 100%;
        padding: 0;
        border-bottom: 1px solid #e5e7eb;
        background: rgba(244, 239, 228, 0.9);
        color: #1f3a4d;
        backdrop-filter: blur(8px);
        font-family: "Plus Jakarta Sans", sans-serif;
      }

      .booking-style-header__inner {
        display: flex;
        width: 100%;
        max-width: 80rem;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        margin: 0 auto;
        padding: 1.25rem 1.5rem;
      }

      .booking-style-logo {
        color: #1f3a4d;
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 0.875rem;
        font-weight: 700;
        letter-spacing: 0.32em;
        line-height: 24px;
        text-decoration: none;
        text-transform: uppercase;
      }

      .booking-style-nav {
        display: flex;
        align-items: center;
        gap: 2rem;
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 0.875rem;
        font-weight: 500;
        line-height: 20px;
      }

      .booking-style-nav a {
        color: #1f3a4d;
        opacity: 0.8;
        text-decoration: none;
        transition: opacity 0.2s ease;
      }

      .booking-style-nav a:hover,
      .booking-style-nav a[aria-current="page"] {
        color: #1f3a4d;
        opacity: 1;
      }

      .booking-style-nav a[aria-current="page"] {
        font-weight: 700;
      }

      @media (min-width: 768px) {
        .booking-style-logo {
          font-size: 1rem;
        }
      }

      @media (max-width: 850px) {
        .booking-style-nav {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="mobile-menu-overlay" id="sidebarOverlay"></div>
    <nav class="mobile-menu-panel" id="sidebar" aria-label="Mobile navigation">
      <a
        class="mobile-menu-brand"
        href="index.html"
        aria-label="Afghanistan Tour home"
      >
        <img src="images/tour-logo.svg" alt="TOUR Travel" />
      </a>
      <ul class="mobile-menu-list">
        <li data-title="Trips">
          <a href="index.html">
            <span class="title">Home</span> <span class="number">01</span>
            <span class="description"></span>
          </a>
        </li>
        <li data-title="Destinations">
          <a href="destination.html">
            <span class="title">Destinations</span>
            <span class="number">02</span>
            <span class="description">Discover more places</span>
          </a>
        </li>
        <li data-title="Tour guide">
          <a href="bookings.html">
            <span class="title">Tour guide</span> <span class="number">03</span>
            <span class="description">Plan your next adventure</span>
          </a>
        </li>
        <li class="active" data-title="Gallery">
          <a href="gallery.html" aria-current="page">
            <span class="title">Gallery</span>
            <span class="number">04</span>
            <span class="description">View travel photos</span>
          </a>
        </li>
      </ul>
      <div class="mobile-menu-socials" aria-label="Social media links">
        <a href="#" title="Instagram" aria-label="Instagram"
          ><svg viewBox="0 0 24 24" aria-hidden="true">

        <a href="#" title="Facebook" aria-label="Facebook"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"

        <a href="#" title="YouTube" aria-label="YouTube"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"

        ></a>
        <a href="#" title="X" aria-label="X"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"
            /></svg
        ></a>
      </div>
    </nav>
    <header class="site-header booking-style-header">
      <div class="booking-style-header__inner">
        <a href="index.html" class="booking-style-logo">Afghanistan</a>
        <button
          class="mobile-menu-btn menu-toggle"
          id="menuToggle"
          type="button"
          aria-controls="sidebar"
          aria-expanded="false"
          aria-label="Open site menu"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
          </svg>
        </button>
        <nav class="site-nav booking-style-nav" id="siteNav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="destination.html">Destinations</a>
          <a href="bookings.html">Booking</a>
          <a href="gallery.html" aria-current="page">Gallery</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="page-head">
        <h1>Gallery</h1>
        <p>Moments from the land of mountains.</p>
      </section>

      <section
        class="gallery-grid"
        id="galleryGrid"
        aria-label="Afghanistan photo gallery"
      >
        <button class="gwrap" type="button" data-caption="Parwan">
          <img
            src="images/FullSizeRender-28.jpg"
            alt="Pink Arghawan blossoms at Gulghundi Hill in Parwan"
            loading="lazy"
          />
          <span aria-hidden="true">Parwan</span>
        </button>
        <button class="gwrap" type="button" data-caption="Noristan">
          <img
            src="images/img_2_1790137915663badkhshan.jpg"
            alt="Mountain scenery and green forests in Noristan"
            loading="lazy"
          />
          <span aria-hidden="true">Noristan</span>
        </button>
        <button class="gwrap" type="button" data-caption="Mazar-i-Sharif">
          <img
            src="images/IMG-20260925-WA0022.jpg"
            alt="Shrine of Hazrat Ali in Mazar-i-Sharif"
            loading="lazy"
          />
          <span aria-hidden="true">Mazar-i-Sharif</span>
        </button>
        <button class="gwrap" type="button" data-caption="Herat">
          <img
            src="images/IMG-20260925-WA0011herat.jpg"
            alt="Historic architecture in Herat"
            loading="lazy"
          />
          <span aria-hidden="true">Herat</span>
        </button>
        <button class="gwrap" type="button" data-caption="Bamyan">
          <img
            src="images/IMG-20260925-WA0013bamyan.jpg"
            alt="Mountain valley in Bamyan"
            loading="lazy"
          />
          <span aria-hidden="true">Bamyan</span>
        </button>
        <button class="gwrap" type="button" data-caption="Kabul">
          <img
            src="images/img_2_1790053530279kabul.jpg"
            alt="City scenery in Kabul"
            loading="lazy"
          />
          <span aria-hidden="true">Kabul</span>
        </button>
      </section>

      <dialog class="lightbox" id="lightbox" aria-labelledby="lightboxCaption">
        <button
          class="lightbox-close"
          id="lightboxClose"
          type="button"
          aria-label="Close image viewer"
        >
          ✕
        </button>
        <div class="lightbox-inner">
          <img id="lightboxImage" src="" alt="" />
          <div class="lightbox-caption" id="lightboxCaption"></div>
          <div class="lightbox-controls">
            <button
              id="lightboxPrevious"
              type="button"
              aria-label="Previous image"
            >
              ← Previous
            </button>
            <button id="lightboxNext" type="button" aria-label="Next image">
              Next →
            </button>
          </div>
        </div>
      </dialog>
    </main>

    <script src="JS/main.js" defer></script>
    <script src="JS/gallery.js" defer></script>
  </body>
</html>
