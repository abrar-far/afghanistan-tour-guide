<!doctype html>
<html lang="en" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Afghanistan | Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --ink: #12262c;
        --cream: #f4ede0;
        --turquoise-deep: #0f4b58;
        --gold: #c99a3c;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      html,
      body {
        background: var(--cream);
      }
      body {
        font-family: "Vazirmatn", sans-serif;
        color: var(--ink);
      }

      header {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 28px;
        background: rgba(244, 237, 224, 0.95);
        backdrop-filter: blur(6px);
        border-bottom: 1px solid rgba(18, 38, 44, 0.08);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: 1.05rem;
        color: var(--turquoise-deep);
        text-decoration: none;
      }
      nav {
        display: flex;
        gap: 24px;
        font-size: 0.9rem;
        font-weight: 500;
      }
      nav a {
        opacity: 0.8;
        color: inherit;
        text-decoration: none;
        transition: opacity 0.2s;
      }
      nav a:hover {
        opacity: 1;
      }
      nav a.active {
        opacity: 1;
        color: var(--turquoise-deep);
        font-weight: 700;
      }
      @media (max-width: 680px) {
        nav {
          display: none;
        }
      }

      .page-head {
        padding: 48px 28px 8px;
        max-width: 1100px;
        margin: 0 auto;
        text-align: left !important;
        direction: ltr !important;
        color: var(--turquoise-deep);
      }

      .page-head p {
        text-align: left !important;
        direction: ltr !important;
        color: #5b6b6d;
      }

      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
        padding: 32px 28px 70px;
        max-width: 1100px;
        margin: 0 auto;
      }
      @media (max-width: 760px) {
        .gallery-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 460px) {
        .gallery-grid {
          grid-template-columns: 1fr;
        }
      }

      .gwrap {
        position: relative;
        border-radius: 16px;
        overflow: hidden;
        aspect-ratio: 4/3;
        background: #274e57;
        cursor: pointer;
      }
      .gwrap img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .gwrap span {
        position: absolute;
        left: 12px;
        bottom: 10px;
        z-index: 2;
        color: #fff;
        font-size: 0.85rem;
        font-weight: 600;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
      }

      .lightbox {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(4, 10, 13, 0.9);
        padding: 24px;
      }
      .lightbox.show {
        display: flex;
      }
      .lightbox-inner {
        max-width: 800px;
        width: 100%;
      }
      .lightbox-inner img {
        width: 100%;
        border-radius: 12px;
        max-height: 70vh;
        object-fit: cover;
        background: #274e57;
      }
      .lightbox-caption {
        color: #fff;
        text-align: center;
        margin-top: 12px;
        font-size: 0.9rem;
      }
      .lightbox-close {
        position: absolute;
        top: 20px;
        right: 20px;
        color: #fff;
        font-size: 1.6rem;
        cursor: pointer;
      }
    </style>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="site-header">
      <a href="index.html" class="brand">🏔️ Afghanistan</a>
      <button
        class="menu-toggle"
        type="button"
        aria-controls="siteNav"
        aria-expanded="false"
        aria-label="Open site menu"
      >
        <span aria-hidden="true">☰</span>
      </button>
      <nav class="site-nav" id="siteNav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="destination.html">Destinations</a>
        <a href="bookings.html">Booking</a>
      </nav>
    </header>

    <main>
      <section class="page-head">
        <h1>Gallery</h1>
        <p>Moments from the land of mountains.</p>
      </section>

      <section
        class="gallery-grid"
        id="galleryGrid"
        aria-label="Afghanistan photo gallery"
      >
        <button class="gwrap" type="button" data-caption="Parwan">
          <img
            src="images/FullSizeRender-28.jpg"
            alt="Pink Arghawan blossoms at Gulghundi Hill in Parwan"
            loading="lazy"
          />
          <span aria-hidden="true">Parwan</span>
        </button>
        <button class="gwrap" type="button" data-caption="Noristan">
          <img
            src="images/img_2_1790137915663badkhshan.jpg"
            alt="Mountain scenery and green forests in Noristan"
            loading="lazy"
          />
          <span aria-hidden="true">Noristan</span>
        </button>
        <button class="gwrap" type="button" data-caption="Mazar-i-Sharif">
          <img
            src="images/IMG-20260925-WA0022.jpg"
            alt="Shrine of Hazrat Ali in Mazar-i-Sharif"
            loading="lazy"
          />
          <span aria-hidden="true">Mazar-i-Sharif</span>
        </button>
        <button class="gwrap" type="button" data-caption="Herat">
          <img
            src="images/IMG-20260925-WA0011herat.jpg"
            alt="Historic architecture in Herat"
            loading="lazy"
          />
          <span aria-hidden="true">Herat</span>
        </button>
        <button class="gwrap" type="button" data-caption="Bamyan">
          <img
            src="images/IMG-20260925-WA0013bamyan.jpg"
            alt="Mountain valley in Bamyan"
            loading="lazy"
          />
          <span aria-hidden="true">Bamyan</span>
        </button>
        <button class="gwrap" type="button" data-caption="Kabul">
          <img
            src="images/img_2_1790053530279kabul.jpg"
            alt="City scenery in Kabul"
            loading="lazy"
          />
          <span aria-hidden="true">Kabul</span>
        </button>
      </section>

      <dialog class="lightbox" id="lightbox" aria-labelledby="lightboxCaption">
        <button
          class="lightbox-close"
          id="lightboxClose"
          type="button"
          aria-label="Close image viewer"
        >
          ✕
        </button>
        <div class="lightbox-inner">
          <img id="lightboxImage" src="" alt="" />
          <div class="lightbox-caption" id="lightboxCaption"></div>
          <div class="lightbox-controls">
            <button
              id="lightboxPrevious"
              type="button"
              aria-label="Previous image"
            >
              ← Previous
            </button>
            <button id="lightboxNext" type="button" aria-label="Next image">
              Next →
            </button>
          </div>
        </div>
      </dialog>
    </main>

    <script src="JS/main.js" defer></script>
    <script src="JS/gallery.js" defer></script>
  </body>
</html>
