<!doctype html>
<html lang="en" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Afghanistan | Booking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- ============================================================
     CSS
     ============================================================ -->
    <style>
      :root {
        --ink: #12262c;
        --cream: #f4ede0;
        --turquoise-deep: #0f4b58;
        --gold: #c99a3c;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      html,
      body {
        background: var(--cream);
      }
      body {
        font-family: "Vazirmatn", sans-serif;
        color: var(--ink);
      }

      header {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 28px;
        background: rgba(244, 237, 224, 0.95);
        backdrop-filter: blur(6px);
        border-bottom: 1px solid rgba(18, 38, 44, 0.08);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: 1.05rem;
        color: var(--turquoise-deep);
        text-decoration: none;
      }
      nav {
        display: flex;
        gap: 24px;
        font-size: 0.9rem;
        font-weight: 500;
      }
      nav a {
        opacity: 0.8;
        color: inherit;
        text-decoration: none;
        transition: opacity 0.2s;
      }
      nav a:hover {
        opacity: 1;
      }
      nav a.active {
        opacity: 1;
        color: var(--turquoise-deep);
        font-weight: 700;
      }
      @media (max-width: 680px) {
        nav {
          display: none;
        }
      }

      .page-head {
        padding: 48px 28px 8px;
        max-width: 700px;
        margin: 0 auto;
        text-align: left;
        direction: ltr;
      }
      .page-head h1 {
        font-size: 2.2rem;
        font-weight: 800;
        color: var(--turquoise-deep);
        margin-bottom: 8px;
      }
      .page-head p {
        color: #5b6b6d;
        font-size: 0.95rem;
      }

      .form-wrap {
        max-width: 700px;
        margin: 24px auto 70px;
        padding: 0 28px;
      }
      form {
        background: #fff;
        border-radius: 20px;
        padding: 32px;
        border: 1px solid rgba(18, 38, 44, 0.08);
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        direction: ltr;
        text-align: left;
      }
      @media (max-width: 560px) {
        form {
          grid-template-columns: 1fr;
        }
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .field.full {
        grid-column: 1/-1;
      }
      label {
        font-size: 0.82rem;
        font-weight: 600;
        color: #3a4c4f;
        text-align: left;
      }
      input,
      select {
        padding: 11px 14px;
        border-radius: 10px;
        border: 1px solid rgba(18, 38, 44, 0.15);
        font-family: inherit;
        font-size: 0.9rem;
        background: #faf7ef;
        direction: ltr;
        text-align: left;
      }
      input:focus,
      select:focus {
        outline: 2px solid var(--turquoise-deep);
        outline-offset: 1px;
      }

      .submit-btn {
        grid-column: 1/-1;
        margin-top: 6px;
        background: var(--turquoise-deep);
        color: #fff;
        border: none;
        padding: 14px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 0.95rem;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      .submit-btn:hover {
        opacity: 0.9;
      }

      .confirm-msg {
        display: none;
        margin-top: 16px;
        padding: 14px 18px;
        border-radius: 12px;
        background: #e4f2ef;
        color: var(--turquoise-deep);
        font-size: 0.9rem;
        font-weight: 600;
        text-align: left;
        direction: ltr;
      }
      .confirm-msg.show {
        display: block;
      }
    </style>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <!-- ============================================================
     HTML
     ============================================================ -->
  <body>
    <header class="site-header">
      <a href="index.html" class="brand">🏔️ Afghanistan</a>
      <button
        class="menu-toggle"
        type="button"
        aria-controls="siteNav"
        aria-expanded="false"
        aria-label="Open site menu"
      >
        <span aria-hidden="true">☰</span>
      </button>
      <nav class="site-nav" id="siteNav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="destination.html">Destinations</a>

        <a href="gallery.html">Gallery</a>
      </nav>
    </header>

    <main>
      <section class="page-head">
        <h1>Book a tour</h1>
        <p>Try the form validation and preview a sample trip request.</p>
      </section>

      <div class="form-wrap">
        <form id="bookingForm">
          <p class="form-notice">
            Front-end demonstration only. This form does not send, save, or
            submit a real booking.
          </p>
          <div class="field">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" autocomplete="name" required />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="destination">Destination</label>
            <select id="destination" required>
              <option value="Band-e Amir">Band-e Amir</option>
              <option value="Minaret of Jam">Minaret of Jam</option>
              <option value="Parwan">Parwan</option>
              <option value="Noristan">Noristan</option>
              <option value="Mazar-i-Sharif">Mazar-i-Sharif</option>
              <option value="Herat">Herat</option>
              <option value="Bamyan">Bamyan</option>
              <option value="Kabul">Kabul</option>
            </select>
          </div>
          <div class="field">
            <label for="guests">Guests</label>
            <input
              type="number"
              id="guests"
              min="1"
              step="1"
              value="1"
              required
            />
            <span class="field-hint">Enter a whole number of at least 1.</span>
          </div>
          <div class="field">
            <label for="startDate">Start date</label>
            <input type="date" id="startDate" required />
            <span class="field-error" id="startDateError"></span>
          </div>
          <div class="field">
            <label for="endDate">End date</label>
            <input type="date" id="endDate" required />
            <span
              class="field-error"
              id="endDateError"
              aria-live="polite"
            ></span>
          </div>
          <div class="field full">
            <label for="notes">Notes</label>
            <input
              type="text"
              id="notes"
              placeholder="Anything we should know?"
            />
          </div>

          <button type="submit" class="submit-btn">Preview demo request</button>
          <p
            class="form-feedback confirm-msg"
            id="formFeedback"
            role="status"
            aria-live="polite"
          ></p>
        </form>
      </div>
    </main>

    <script src="JS/main.js" defer></script>
    <script src="JS/booking.js" defer></script>
  </body>
</html>
