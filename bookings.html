<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Book a Tour — Afghanistan</title>

    <meta
      name="description"
      content="Reserve your guided Afghanistan tour with a live trip preview and price summary."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: "#f4efe4",
              foreground: "#1d2733",
              card: "#fbf8f0",
              primary: "#1f3a4d",
              "primary-foreground": "#f7f3ea",
              muted: "#8a8f96",
              accent: "#2e5f7a",
              night: "#121b26",
              "night-foreground": "#f2eee2",
              sand: "#e3c57e",
            },

            fontFamily: {
              sans: ['"Plus Jakarta Sans"', "sans-serif"],
            },
          },
        },
      };
    </script>

    <style>
      .logo-type {
        font-weight: 700;
        letter-spacing: 0.32em;
        text-transform: uppercase;
      }

      html {
        scroll-padding-top: 6rem;
      }

      /* Mobile navigation */
      .site-nav {
        display: flex;
        align-items: center;
        gap: 2rem;
      }

      .site-nav a[aria-current="page"] {
        font-weight: 700;
        opacity: 1;
      }

      #bookingForm select {
        color-scheme: light;
      }

      #bookingForm select option:checked {
        background: #777 linear-gradient(#777, #777) !important;
        color: #fff !important;
      }

      #bookingForm input[type="date"] {
        accent-color: #777 !important;
        color-scheme: light;
      }

      #bookingForm select:focus,
      #bookingForm select:focus-visible,
      #bookingForm input[type="date"]:focus,
      #bookingForm input[type="date"]:focus-visible {
        border-color: #777 !important;
        --tw-ring-color: #777 !important;
        outline: 2px solid #777 !important;
        outline-offset: 1px;
        box-shadow: 0 0 0 3px rgba(119, 119, 119, 0.25) !important;
      }

      .menu-toggle {
        display: none;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        border: 0;
        background: transparent;
        color: #1f3a4d;
        cursor: pointer;
      }

      @media (max-width: 767px) {
        .menu-toggle {
          display: flex;
        }

        .site-nav {
          display: none;
          width: 100%;
          flex-direction: column;
          align-items: stretch;
          gap: 0;
          margin-top: 1rem;
          padding: 0.75rem 0 1rem;
          border-top: 1px solid rgba(18, 27, 38, 0.1);
        }

        .site-nav.is-open {
          display: flex;
        }

        .site-nav a {
          padding: 0.75rem 0;
        }
      }
    </style>
    <link rel="stylesheet" href="css/mobile-menu.css" />
  </head>

  <body class="scroll-smooth bg-background font-sans text-foreground">
    <div class="mobile-menu-overlay" id="sidebarOverlay"></div>
    <nav class="mobile-menu-panel" id="sidebar" aria-label="Mobile navigation">
      <a
        class="mobile-menu-brand"
        href="index.html"
        aria-label="Afghanistan Tour home"
      >
        <img src="images/tour-logo.svg" alt="TOUR Travel" />
      </a>
      <ul class="mobile-menu-list">
        <li data-title="Trips">
          <a href="index.html">
            <span class="title">Home</span> <span class="number">01</span>
            <span class="description">
          </a>
        </li>
        <li data-title="Destinations">
          <a href="destination.html">
            <span class="title">Destinations</span>
            <span class="number">02</span>
            <span class="description">Discover more places</span>
          </a>
        </li>
        <li class="active" data-title="Tour guide">
          <a href="bookings.html" aria-current="page">
            <span class="title">Tour guide</span> <span class="number">03</span>
            <span class="description">Plan your next adventure</span>
          </a>
        </li>
        <li data-title="Gallery">
          <a href="gallery.html">
            <span class="title">Gallery</span>
            <span class="number">04</span>
            <span class="description">View travel photos</span>
          </a>
        </li>
      </ul>
      <div class="mobile-menu-socials" aria-label="Social media links">
        <a href="#" title="Instagram" aria-label="Instagram"
          ><svg viewBox="0 0 24 24" aria-hidden="true">

               d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.011 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"
            /></svg
        ></a>
        <a href="#" title="Facebook" aria-label="Facebook"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"
            /></svg
        ></a>
        <a href="#" title="YouTube" aria-label="YouTube"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"
            /></svg
        ></a>
        <a href="#" title="X" aria-label="X"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"
            /></svg
        ></a>
      </div>
    </nav>
    <!-- Header -->
    <header
      class="sticky inset-x-0 top-0 z-40 border-b bg-background/90 text-primary backdrop-blur"
    >
      <div
        class="mx-auto flex max-w-7xl flex-wrap items-center justify-between px-6 py-5"
      >
        <a href="index.html" class="logo-type text-sm md:text-base">
          Afghanistan
        </a>
        <button
          class="mobile-menu-btn menu-toggle"
          id="menuToggle"
          type="button"
          aria-controls="sidebar"
          aria-expanded="false"
          aria-label="Open site menu"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
          </svg>
        </button>

        <!-- Navigation -->
        <nav
          class="site-nav items-start gap-8 text-sm font-medium"
          id="siteNav"
          aria-label="Main navigation"
        >
          <a href="index.html" class="opacity-80 transition hover:opacity-100">
            Home
          </a>

          <a
            href="destination.html"
            class="opacity-80 transition hover:opacity-100"
          >
            Destinations
          </a>

          <a
            href="bookings.html"
            class="opacity-80 transition hover:opacity-100"
            aria-current="page"
          >
            Booking
          </a>

          <a
            href="gallery.html"
            class="opacity-80 transition hover:opacity-100"
          >
            Gallery
          </a>
        </nav>
      </div>
    </header>

    <!-- Main -->
    <main
      class="mx-auto grid max-w-7xl gap-10 px-6 py-16 lg:grid-cols-[1.1fr_1fr]"
    >
      <!-- Booking form -->
      <section>
        <h1 class="text-4xl font-extrabold text-primary md:text-5xl">
          Book your journey
        </h1>

        <div
          id="formFeedback"
          role="status"
          class="mt-6 hidden rounded-xl border border-emerald-600/40 bg-emerald-600/10 px-5 py-4 text-sm font-medium text-emerald-700"
        ></div>

        <form
          id="bookingForm"
          novalidate
          class="mt-8 grid gap-5 sm:grid-cols-2"
        >
          <!-- Full name -->
          <label class="text-sm font-medium sm:col-span-2">
            Full name

            <input
              id="fullName"
              name="name"
              type="text"
              required
              minlength="2"
              autocomplete="name"
              class="mt-1 w-full rounded-lg border bg-card px-4 py-3 outline-none transition focus:border-accent focus:ring-2 focus:ring-accent/30 [&.touched:invalid]:border-red-600"
            />
          </label>

          <!-- Email -->
          <label class="text-sm font-medium sm:col-span-2">
            Email

            <input
              id="email"
              name="email"
              type="email"
              required
              autocomplete="email"
              class="mt-1 w-full rounded-lg border bg-card px-4 py-3 outline-none transition focus:border-accent focus:ring-2 focus:ring-accent/30 [&.touched:invalid]:border-red-600"
            />
          </label>

          <!-- Destination -->
          <label class="text-sm font-medium">
            Destination

            <select
              id="destination"
              name="destination"
              required
              class="mt-1 w-full rounded-lg border bg-card px-4 py-3 outline-none transition [&.touched:invalid]:border-red-600"
            >
              <option value="">Choose a destination</option>
              <option value="Band-e Amir">Band-e Amir</option>
              <option value="Bamyan">Bamyan</option>
              <option value="Herat">Herat</option>
              <option value="Kabul">Kabul</option>
              <option value="Mazar-i-Sharif">Mazar-i-Sharif</option>
              <option value="Noristan">Noristan</option>
              <option value="Parwan">Parwan</option>
            </select>
          </label>

          <!-- Guests -->
          <label class="text-sm font-medium">
            Guests

            <input
              id="guests"
              name="guests"
              type="number"
              min="1"
              max="12"
              value="2"
              required
              class="mt-1 w-full rounded-lg border bg-card px-4 py-3 outline-none transition focus:border-accent focus:ring-2 focus:ring-accent/30 [&.touched:invalid]:border-red-600"
            />
          </label>

          <!-- Start date -->
          <label class="text-sm font-medium">
            Start date

            <input
              id="startDate"
              name="startDate"
              type="date"
              required
              class="mt-1 w-full rounded-lg border bg-card px-4 py-3 outline-none transition [&.touched:invalid]:border-red-600"
            />
          </label>

          <!-- End date -->
          <label class="text-sm font-medium">
            End date

            <input
              id="endDate"
              name="endDate"
              type="date"
              required
              class="mt-1 w-full rounded-lg border bg-card px-4 py-3 outline-none transition [&.touched:invalid]:border-red-600"
            />
          </label>

          <small
            id="endDateError"
            class="text-sm text-red-600 sm:col-span-2"
            role="alert"
          ></small>

          <!-- Special requests -->
          <label class="text-sm font-medium sm:col-span-2">
            Special requests

            <textarea
              id="notes"
              name="notes"
              rows="4"
              class="mt-1 w-full rounded-lg border bg-card px-4 py-3 outline-none transition focus:border-accent focus:ring-2 focus:ring-accent/30"
            ></textarea>
          </label>

          <!-- Submit -->
          <button
            type="submit"
            class="rounded-full bg-primary px-8 py-4 font-semibold text-primary-foreground transition hover:bg-accent sm:col-span-2 sm:justify-self-start"
          >
            Confirm booking
          </button>
        </form>
      </section>

      <!-- Trip preview -->
      <aside class="lg:sticky lg:top-28 lg:self-start">
        <div
          class="overflow-hidden rounded-2xl bg-night text-night-foreground shadow-xl"
        >
          <img id="p-img" class="aspect-[16/10] w-full object-cover" alt="" />

          <div class="p-7">
            <p
              id="p-region"
              class="text-xs uppercase tracking-widest opacity-60"
            ></p>

            <h2 id="p-name" class="text-2xl font-bold"></h2>

            <ul id="p-itin" class="mt-5 space-y-2 text-sm"></ul>

            <dl class="mt-6 space-y-2 border-t border-white/15 pt-5 text-sm">
              <div class="flex justify-between">
                <dt class="opacity-70">Rate</dt>
                <dd id="p-rate"></dd>
              </div>

              <div class="flex justify-between">
                <dt class="opacity-70">Nights</dt>
                <dd id="p-nights"></dd>
              </div>

              <div class="flex justify-between">
                <dt class="opacity-70">Guests</dt>
                <dd id="p-guests"></dd>
              </div>

              <div class="flex justify-between pt-2 text-lg font-bold">
                <dt>Total</dt>
                <dd id="p-total" class="text-sand"></dd>
              </div>
            </dl>
          </div>
        </div>

        <!-- Saved bookings -->
        <div id="saved-box" class="mt-6 hidden rounded-2xl border bg-card p-6">
          <h3 class="font-semibold text-primary">Your bookings</h3>

          <ul id="saved" class="mt-3 divide-y text-sm"></ul>
        </div>
      </aside>
    </main>

    <!-- Shared site JavaScript -->
    <script src="JS/main.js" defer></script>

    <!-- Booking JavaScript -->
    <script src="JS/booking.js" defer></script>
  </body>
</html>
>
