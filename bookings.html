<!doctype html>
<html lang="en" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Afghanistan | Booking & Reservations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- ============================================================
       CSS
       ============================================================ -->
    <style>
      :root {
        --ink: #12262c;
        --cream: #f4ede0;
        --turquoise-deep: #0f4b58;
        --turquoise-light: #186b7d;
        --gold: #c99a3c;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      html,
      body {
        background: var(--cream);
      }
      body {
        font-family: "Vazirmatn", sans-serif;
        color: var(--ink);
      }

      header {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 28px;
        background: rgba(244, 237, 224, 0.95);
        backdrop-filter: blur(6px);
        border-bottom: 1px solid rgba(18, 38, 44, 0.08);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: 1.05rem;
        color: var(--turquoise-deep);
        text-decoration: none;
      }
      nav {
        display: flex;
        gap: 24px;
        font-size: 0.9rem;
        font-weight: 500;
      }
      nav a {
        opacity: 0.8;
        color: inherit;
        text-decoration: none;
        transition: opacity 0.2s;
      }
      nav a:hover {
        opacity: 1;
      }
      nav a.active {
        opacity: 1;
        color: var(--turquoise-deep);
        font-weight: 700;
      }
      @media (max-width: 680px) {
        nav {
          display: none;
        }
      }

      .page-head {
        padding: 48px 28px 12px;
        max-width: 720px;
        margin: 0 auto;
        text-align: left;
        direction: ltr;
      }
      .page-head h1 {
        font-size: 2.3rem;
        font-weight: 800;
        color: var(--turquoise-deep);
        margin-bottom: 6px;
        letter-spacing: -0.5px;
      }
      .page-head p {
        color: #5b6b6d;
        font-size: 0.98rem;
        line-height: 1.5;
      }

      .form-wrap {
        max-width: 720px;
        margin: 20px auto 70px;
        padding: 0 28px;
      }
      form {
        background: #ffffff;
        border-radius: 20px;
        padding: 36px;
        border: 1px solid rgba(18, 38, 44, 0.08);
        box-shadow: 0 12px 32px rgba(18, 38, 44, 0.04);
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        direction: ltr;
        text-align: left;
      }
      @media (max-width: 560px) {
        form {
          grid-template-columns: 1fr;
          padding: 24px;
        }
      }

      .form-header {
        grid-column: 1 / -1;
        border-bottom: 1px solid rgba(18, 38, 44, 0.08);
        padding-bottom: 16px;
        margin-bottom: 4px;
      }
      .form-header h2 {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--turquoise-deep);
      }
      .form-header p {
        font-size: 0.85rem;
        color: #6a7c7f;
        margin-top: 2px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .field.full {
        grid-column: 1 / -1;
      }
      label {
        font-size: 0.82rem;
        font-weight: 700;
        color: #2c3e42;
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }
      input,
      select {
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid rgba(18, 38, 44, 0.16);
        font-family: inherit;
        font-size: 0.92rem;
        background: #fcfaf5;
        color: var(--ink);
        direction: ltr;
        text-align: left;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      input:focus,
      select:focus {
        outline: none;
        border-color: var(--turquoise-deep);
        box-shadow: 0 0 0 3px rgba(15, 75, 88, 0.15);
        background: #ffffff;
      }

      .field-hint {
        font-size: 0.75rem;
        color: #728487;
      }
      .field-error {
        font-size: 0.78rem;
        color: #c0392b;
        font-weight: 600;
      }

      .submit-btn {
        grid-column: 1 / -1;
        margin-top: 8px;
        background: var(--turquoise-deep);
        color: #ffffff;
        border: none;
        padding: 15px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 0.98rem;
        cursor: pointer;
        transition:
          background-color 0.2s,
          transform 0.1s;
      }
      .submit-btn:hover {
        background: var(--turquoise-light);
      }
      .submit-btn:active {
        transform: scale(0.99);
      }

      .confirm-msg {
        display: none;
        grid-column: 1 / -1;
        margin-top: 10px;
        padding: 16px 20px;
        border-radius: 12px;
        background: #e6f4f1;
        border-left: 4px solid var(--turquoise-deep);
        color: var(--turquoise-deep);
        font-size: 0.9rem;
        font-weight: 600;
        line-height: 1.5;
        text-align: left;
        direction: ltr;
      }
      .confirm-msg.show {
        display: block;
      }
      .confirm-msg[data-state="error"] {
        background: #fdf2f2;
        border-left-color: #d9534f;
        color: #a94442;
      }
    </style>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <!-- ============================================================
       HTML
       ============================================================ -->
  <body>
    <header class="site-header">
      <a href="index.html" class="brand">🏔️ Afghanistan</a>
      <button
        class="menu-toggle"
        type="button"
        aria-controls="siteNav"
        aria-expanded="false"
        aria-label="Open site menu"
      >
        <span aria-hidden="true">☰</span>
      </button>
      <nav class="site-nav" id="siteNav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="destination.html">Destinations</a>
        <a href="gallery.html">Gallery</a>
      </nav>
    </header>

    <main>
      <section class="page-head">
        <h1>Book Your Tour</h1>
        <p>
          Select your destination, travel dates, and party size to confirm your
          reservation.
        </p>
      </section>

      <div class="form-wrap">
        <form id="bookingForm">
          <div class="form-header">
            <h2>Reservation Details</h2>
            <p>
              Please complete all required fields to proceed with your travel
              request.
            </p>
          </div>

          <div class="field">
            <label for="fullName">Full Name</label>
            <input
              type="text"
              id="fullName"
              autocomplete="name"
              placeholder="John Doe"
              required
            />
          </div>

          <div class="field">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              autocomplete="email"
              placeholder="name@example.com"
              required
            />
          </div>

          <div class="field">
            <label for="destination">Destination</label>
            <select id="destination" required>
              <option value="Band-e Amir">Band-e Amir</option>
              <option value="Minaret of Jam">Minaret of Jam</option>
              <option value="Parwan">Parwan</option>
              <option value="Noristan">Noristan</option>
              <option value="Mazar-i-Sharif">Mazar-i-Sharif</option>
              <option value="Herat">Herat</option>
              <option value="Bamyan">Bamyan</option>
              <option value="Kabul">Kabul</option>
            </select>
          </div>

          <div class="field">
            <label for="guests">Guests</label>
            <input
              type="number"
              id="guests"
              min="1"
              step="1"
              value="1"
              required
            />
            <span class="field-hint">Enter total number of travelers.</span>
          </div>

          <div class="field">
            <label for="startDate">Start Date</label>
            <input type="date" id="startDate" required />
            <span class="field-error" id="startDateError"></span>
          </div>

          <div class="field">
            <label for="endDate">End Date</label>
            <input type="date" id="endDate" required />
            <span
              class="field-error"
              id="endDateError"
              aria-live="polite"
            ></span>
          </div>

          <div class="field full">
            <label for="notes">Special Notes & Requests</label>
            <input
              type="text"
              id="notes"
              placeholder="e.g. Dietary preferences, accessibility needs, or flight details"
            />
          </div>

          <button type="submit" class="submit-btn">Confirm Reservation</button>

          <div
            class="confirm-msg"
            id="formFeedback"
            role="status"
            aria-live="polite"
          ></div>
        </form>
      </div>
    </main>

    <script src="JS/main.js" defer></script>
    <script src="JS/booking.js" defer></script>
  </body>
</html>
