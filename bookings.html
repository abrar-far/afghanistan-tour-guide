<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Book a Tour — Afghanistan</title>

    <meta
      name="description"
      content="Reserve your guided Afghanistan tour with a live trip preview and price summary."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: "#f4efe4",
              foreground: "#1d2733",
              card: "#fbf8f0",
              primary: "#1f3a4d",
              "primary-foreground": "#f7f3ea",
              muted: "#8a8f96",
              accent: "#2e5f7a",
              night: "#121b26",
              "night-foreground": "#f2eee2",
              sand: "#e3c57e",
            },

            fontFamily: {
              sans: ['"Plus Jakarta Sans"', "sans-serif"],
            },
          },
        },
      };
    </script>

    <style>
      .logo-type {
        font-weight: 700;
        letter-spacing: 0.32em;
        text-transform: uppercase;
      }

      html {
        scroll-padding-top: 6rem;
      }

      /* Mobile navigation */
      .site-nav {
        display: flex;
        align-items: center;
        gap: 2rem;
      }

      .menu-toggle {
        display: none;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        border: 0;
        background: transparent;
        color: #1f3a4d;
        cursor: pointer;
      }

      @media (max-width: 767px) {
        .menu-toggle {
          display: flex;
        }

        .site-nav {
          display: none;
          width: 100%;
          flex-direction: column;
          align-items: stretch;
          gap: 0;
          margin-top: 1rem;
          padding: 0.75rem 0 1rem;
          border-top: 1px solid rgba(18, 27, 38, 0.1);
        }

        .site-nav.is-open {
          display: flex;
        }

        .site-nav a {
          padding: 0.75rem 0;
        }
      }
    </style>
  </head>

  <body class="scroll-smooth bg-background font-sans text-foreground">
    <!-- Header -->
    <header
      class="sticky inset-x-0 top-0 z-40 border-b bg-background/90 text-primary backdrop-blur"
    >
      <div
        class="mx-auto flex max-w-7xl flex-wrap items-center justify-between px-6 py-5"
      >
        <a href="index.html" class="logo-type text-sm md:text-base">
          Afghanistan
        </a>

        <!-- Mobile menu button -->
        <button
          class="menu-toggle"
          type="button"
          aria-controls="siteNav"
          aria-expanded="false"
          aria-label="Open site menu"
        >
          <svg
            class="h-6 w-6"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>

        <!-- Navigation -->
        <nav
          class="site-nav hidden items-start gap-8 text-sm font-medium md:flex"
          id="siteNav"
          aria-label="Main navigation"
        >
          <a href="index.html" class="opacity-80 transition hover:opacity-100">
            Home
          </a>

          <a
            href="destination.html"
            class="opacity-80 transition hover:opacity-100"
          >
            Destinations
          </a>

          <a
            href="gallery.html"
            class="opacity-80 transition hover:opacity-100"
          >
            Gallery
          </a>
        </nav>
      </div>
    </header>

    <!-- Main -->
    <main
      class="mx-auto grid max-w-7xl gap-10 px-6 py-16 lg:grid-cols-[1.1fr_1fr]"
    >
      <!-- Booking form -->
      <section>
        <h1 class="text-4xl font-extrabold text-primary md:text-5xl">
          Book your journey
        </h1>

        <div
          id="formFeedback"
          role="status"
          class="mt-6 hidden rounded-xl border border-emerald-600/40 bg-emerald-600/10 px-5 py-4 text-sm font-medium text-emerald-700"
        ></div>

        <form
          id="bookingForm"
          novalidate
          class="mt-8 grid gap-5 sm:grid-cols-2"
        >
          <!-- Full name -->
          <label class="text-sm font-medium sm:col-span-2">
            Full name

            <input
              id="fullName"
              name="name"
              type="text"
              required
              minlength="2"
              autocomplete="name"
              class="mt-1 w-full rounded-lg border bg-card px-4 py-3 outline-none transition focus:border-accent focus:ring-2 focus:ring-accent/30 [&.touched:invalid]:border-red-600"
            />
          </label>

          <!-- Email -->
          <label class="text-sm font-medium sm:col-span-2">
            Email

            <input
              id="email"
              name="email"
              type="email"
              required
              autocomplete="email"
              class="mt-1 w-full rounded-lg border bg-card px-4 py-3 outline-none transition focus:border-accent focus:ring-2 focus:ring-accent/30 [&.touched:invalid]:border-red-600"
            />
          </label>

          <!-- Destination -->
          <label class="text-sm font-medium">
            Destination

            <select
              id="destination"
              name="destination"
              required
              class="mt-1 w-full rounded-lg border bg-card px-4 py-3 outline-none transition focus:border-accent focus:ring-2 focus:ring-accent/30 [&.touched:invalid]:border-red-600"
            >
              <option value="">Choose a destination</option>
              <option value="Band-e Amir">Band-e Amir</option>
              <option value="Bamyan">Bamyan</option>
              <option value="Herat">Herat</option>
              <option value="Kabul">Kabul</option>
              <option value="Mazar-i-Sharif">Mazar-i-Sharif</option>
              <option value="Noristan">Noristan</option>
              <option value="Parwan">Parwan</option>
            </select>
          </label>

          <!-- Guests -->
          <label class="text-sm font-medium">
            Guests

            <input
              id="guests"
              name="guests"
              type="number"
              min="1"
              max="12"
              value="2"
              required
              class="mt-1 w-full rounded-lg border bg-card px-4 py-3 outline-none transition focus:border-accent focus:ring-2 focus:ring-accent/30 [&.touched:invalid]:border-red-600"
            />
          </label>

          <!-- Start date -->
          <label class="text-sm font-medium">
            Start date

            <input
              id="startDate"
              name="startDate"
              type="date"
              required
              class="mt-1 w-full rounded-lg border bg-card px-4 py-3 outline-none transition focus:border-accent focus:ring-2 focus:ring-accent/30 [&.touched:invalid]:border-red-600"
            />
          </label>

          <!-- End date -->
          <label class="text-sm font-medium">
            End date

            <input
              id="endDate"
              name="endDate"
              type="date"
              required
              class="mt-1 w-full rounded-lg border bg-card px-4 py-3 outline-none transition focus:border-accent focus:ring-2 focus:ring-accent/30 [&.touched:invalid]:border-red-600"
            />
          </label>

          <small
            id="endDateError"
            class="text-sm text-red-600 sm:col-span-2"
            role="alert"
          ></small>

          <!-- Special requests -->
          <label class="text-sm font-medium sm:col-span-2">
            Special requests

            <textarea
              id="notes"
              name="notes"
              rows="4"
              class="mt-1 w-full rounded-lg border bg-card px-4 py-3 outline-none transition focus:border-accent focus:ring-2 focus:ring-accent/30"
            ></textarea>
          </label>

          <!-- Submit -->
          <button
            type="submit"
            class="rounded-full bg-primary px-8 py-4 font-semibold text-primary-foreground transition hover:bg-accent sm:col-span-2 sm:justify-self-start"
          >
            Confirm booking
          </button>
        </form>
      </section>

      <!-- Trip preview -->
      <aside class="lg:sticky lg:top-28 lg:self-start">
        <div
          class="overflow-hidden rounded-2xl bg-night text-night-foreground shadow-xl"
        >
          <img id="p-img" class="aspect-[16/10] w-full object-cover" alt="" />

          <div class="p-7">
            <p
              id="p-region"
              class="text-xs uppercase tracking-widest opacity-60"
            ></p>

            <h2 id="p-name" class="text-2xl font-bold"></h2>

            <ul id="p-itin" class="mt-5 space-y-2 text-sm"></ul>

            <dl class="mt-6 space-y-2 border-t border-white/15 pt-5 text-sm">
              <div class="flex justify-between">
                <dt class="opacity-70">Rate</dt>
                <dd id="p-rate"></dd>
              </div>

              <div class="flex justify-between">
                <dt class="opacity-70">Nights</dt>
                <dd id="p-nights"></dd>
              </div>

              <div class="flex justify-between">
                <dt class="opacity-70">Guests</dt>
                <dd id="p-guests"></dd>
              </div>

              <div class="flex justify-between pt-2 text-lg font-bold">
                <dt>Total</dt>
                <dd id="p-total" class="text-sand"></dd>
              </div>
            </dl>
          </div>
        </div>

        <!-- Saved bookings -->
        <div id="saved-box" class="mt-6 hidden rounded-2xl border bg-card p-6">
          <h3 class="font-semibold text-primary">Your bookings</h3>

          <ul id="saved" class="mt-3 divide-y text-sm"></ul>
        </div>
      </aside>
    </main>

    <!-- Shared site JavaScript -->
    <script src="JS/main.js" defer></script>

    <!-- Booking JavaScript -->
    <script src="JS/booking.js" defer></script>

    <!-- Mobile navigation -->
    <script>
      // // ==========================================
      // // 1. مدیریت منوی موبایل (Mobile Hamburger Menu)
      // // ==========================================
      const menuBtn = document.getElementById("menu-btn");
      const mobileMenu = document.getElementById("mobile-menu");

      if (menuBtn && mobileMenu) {
        // کلیک روی دکمه همبرگر
        menuBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          mobileMenu.classList.toggle("hidden");
        });

        // بستن منو هنگام کلیک روی لینک‌های داخل آن
        const mobileLinks = mobileMenu.querySelectorAll("a");
        mobileLinks.forEach((link) => {
          link.addEventListener("click", () => {
            mobileMenu.classList.add("hidden");
          });
        });

        // بستن منو در صورت کلیک بیرون از منو
        document.addEventListener("click", (e) => {
          if (!mobileMenu.contains(e.target) && !menuBtn.contains(e.target)) {
            mobileMenu.classList.add("hidden");
          }
        });
      }
    </script>
  </body>
</html>
>
