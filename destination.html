<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Afghanistan | Destinations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: "#f4efe4",
              foreground: "#1d2733",
              card: "#fbf8f0",
              primary: "#1f3a4d",
              "primary-foreground": "#f7f3ea",
              muted: "#8a8f96",
              accent: "#2e5f7a",
              night: "#121b26",
              "night-foreground": "#f2eee2",
              sand: "#e3c57e",
            },
            fontFamily: { sans: ['"Plus Jakarta Sans"', "sans-serif"] },
          },
        },
      };
    </script>
    <!-- ============================================================
     CSS
     ============================================================ -->
    <style>
      .logo-type {
        font-weight: 700;
        letter-spacing: 0.32em;
        text-transform: uppercase;
      }
      .hero-scrim {
        background: linear-gradient(
          180deg,
          rgba(18, 27, 38, 0.7) 0%,
          rgba(18, 27, 38, 0.2) 40%,
          rgba(18, 27, 38, 0.85) 100%
        );
      }
      .glass {
        background: rgba(18, 27, 38, 0.45);
        backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
      :root {
        --ink: #12262c;
        --cream: #f4ede0;
        --turquoise-deep: #0f4b58;
        --gold: #c99a3c;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      html,
      body {
        background: var(--cream);
      }
      body {
        font-family: "Vazirmatn", sans-serif;
        color: var(--ink);
      }

      header {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 28px;
        background: rgba(244, 237, 224, 0.95);
        backdrop-filter: blur(6px);
        border-bottom: 1px solid rgba(18, 38, 44, 0.08);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: 1.05rem;
        color: var(--turquoise-deep);
        text-decoration: none;
      }
      nav {
        display: flex;
        gap: 24px;
        font-size: 0.9rem;
        font-weight: 500;
      }
      nav a {
        opacity: 0.8;
        color: inherit;
        text-decoration: none;
        transition: opacity 0.2s;
      }
      nav a:hover {
        opacity: 1;
      }
      nav a.active {
        opacity: 1;
        color: var(--turquoise-deep);
        font-weight: 700;
      }
      @media (max-width: 680px) {
        nav {
          display: none;
        }
      }

      .page-head {
        padding: 48px 28px 8px;
        max-width: 1100px;
        margin: 0 auto;
        text-align: left;
        direction: ltr;
      }
      .page-head h1 {
        color: var(--turquoise-deep);
      }

      .page-head p {
        color: #5b6b6d;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        padding: 32px 28px 70px;
        max-width: 1100px;
        margin: 0 auto;
      }
      @media (max-width: 900px) {
        .grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 560px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }

      .card {
        background: #fff;
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid rgba(18, 38, 44, 0.08);
        cursor: pointer;
        transition: transform 0.2s ease;
      }
      .card:hover {
        transform: translateY(-4px);
      }

      .card-image-wrap {
        position: relative;
        aspect-ratio: 4/3;
        background: #274e57;
        overflow: hidden;
      }
      .card-image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .card-dark {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(4, 12, 15, 0) 40%,
          rgba(4, 10, 13, 0.7)
        );
      }
      .card-tag {
        position: absolute;
        left: 14px;
        bottom: 12px;
        z-index: 2;
        color: #fff;
        font-weight: 700;
        font-size: 1.05rem;
        direction: ltr;
        text-align: left;
      }

      .card-body {
        padding: 16px 18px 20px;
        text-align: left;
        direction: ltr;
      }
      .card-body p {
        font-size: 0.85rem;
        color: #5b6b6d;
        margin-top: 4px;
        text-align: left;
        direction: ltr;
      }
      .card-body .btn {
        display: inline-block;
        margin-top: 12px;
        padding: 8px 16px;
        border-radius: 999px;
        background: var(--turquoise-deep);
        color: #fff;
        font-size: 0.82rem;
        font-weight: 600;
      }
    </style>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <!-- ============================================================
     HTML
     ============================================================ -->
  <body>
    <header class="site-header">
      <a href="index.html" class="logo"> Afghanistan</a>
      <button
        class="menu-toggle"
        type="button"
        aria-controls="siteNav"
        aria-expanded="false"
        aria-label="Open site menu"
      >
        <span aria-hidden="true">☰</span>
      </button>
      <nav class="site-nav" id="siteNav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="bookings.html">Booking</a>
      </nav>
    </header>

    <main>
      <section class="page-head">
        <h1 class="text-4xl font-extrabold text-primary md:text-5xl">
          Destinations
        </h1>
        <p>
          Explore the places worth visiting across Afghanistan, from turquoise
          lakes to ancient minarets.
        </p>
      </section>

      <section class="weather-panel" aria-labelledby="weatherHeading">
        <h2 id="weatherHeading">Current weather</h2>
        <p>
          Check general weather conditions for a destination. Not a
          travel-safety forecast.
        </p>
        <form class="weather-controls" id="weatherForm">
          <label for="weatherLocation">Destination</label>
          <select id="weatherLocation">
            <option>Kabul</option>
            <option>Band-e Amir</option>
            <option>Bamyan</option>
            <option>Herat</option>
            <option>Mazar-i-Sharif</option>
            <option>Parwan</option>
            <option>Noristan</option>
          </select>
          <button type="submit">Get current weather</button>
        </form>
        <div
          class="weather-result"
          id="weatherResult"
          role="status"
          aria-live="polite"
        >
          <p>Choose a destination and request current conditions.</p>
        </div>
      </section>

      <section
        class="destination-tools"
        aria-label="Search and filter destinations"
      >
        <label for="destinationSearch">
          Search destinations
          <input
            type="search"
            id="destinationSearch"
            placeholder="Try Herat or mountains"
            autocomplete="off"
          />
        </label>
        <label for="categoryFilter">
          Category
          <select id="categoryFilter">
            <option value="all">All categories</option>
            <option value="Nature">Nature</option>
            <option value="Culture">Culture</option>
            <option value="History">History</option>
            <option value="City">City</option>
          </select>
        </label>
        <p class="results-count" id="resultsCount" aria-live="polite"></p>
      </section>

      <section
        class="grid"
        id="destinationGrid"
        aria-label="Destinations"
      ></section>
    </main>

    <script src="JS/main.js" defer></script>
  </body>
</html>
